name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_installer:
        description: "Also build LoopBooks-Setup.exe"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Packaging contract
        run: node --experimental-strip-types --test tests/unit/release.test.ts

      - name: Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --skip payment_cells_include_first_payment_ordinal

  windows-nsis:
    if: github.event_name == 'workflow_dispatch' && inputs.build_installer
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: npm ci

      - name: Refuse secrets in the tree
        shell: bash
        run: |
          if [ -f credentials.json ] || [ -f secrets/google-service-account.json ]; then
            echo "credentials.json must not be in the checkout used to build the installer."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)credentials\\.json$|google-service-account\\.json$'; then
            echo "Tracked credential files are forbidden."
            exit 1
          fi

      - name: Build LoopBooks-Setup.exe
        shell: bash
        run: |
          npm run tauri:build
          node scripts/rename-installer.mjs

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LoopBooks-Setup
          path: dist/installers/LoopBooks-Setup.exe
          if-no-files-found: error
