name: Build TBooks Installer

# Keep a manual trigger. Push builds live in build.yml so we do not
# spend two Windows runners on every commit.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: npm ci

      - name: Build T-Books-Setup.exe
        run: npm run tauri:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: T-Books-Setup
          path: dist/installers/T-Books-Setup.exe
          if-no-files-found: error
