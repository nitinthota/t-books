name: Build TBooks Installer

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NSIS
        run: choco install nsis -y
        continue-on-error: true

      - name: WebView2 (optional)
        run: choco install microsoft-edge-webview2-runtime -y
        continue-on-error: true

      - name: Install dependencies
        run: npm ci

      - name: Refuse secrets in the tree
        shell: bash
        run: |
          if [ -f credentials.json ] || [ -f secrets/google-service-account.json ]; then
            echo "credentials must not be in the build tree."
            exit 1
          fi

      - name: Build frontend (Vite for Tauri)
        run: npm run build:tauri

      - name: Show frontend dist
        shell: bash
        run: ls -la dist/client | head -30

      - name: Build Tauri + NSIS installer
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --ci 2>&1 | tee tauri-build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: tauri-build.log
          if-no-files-found: warn

      - name: Rename installer to T-Books-Setup.exe
        run: node scripts/rename-installer.mjs

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TBooks-Build
          path: |
            dist/installers/T-Books-Setup.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
